name: CI

on:
  push:
  pull_request:

jobs:
  unity-core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify native Unity runtime without editor or NuGet packages
        run: dotnet run --project integrations/unity/tests/StoryBlueprint.OfflineTests.csproj --configuration Release
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify package entry points
        run: |
          node -e "for (const name of ['@story-blueprint/common','@story-blueprint/compiler','@story-blueprint/runtime','@story-blueprint/sdk']) require(name)"
          node --input-type=module -e "for (const name of ['@story-blueprint/common','@story-blueprint/compiler','@story-blueprint/runtime','@story-blueprint/sdk']) await import(name)"
